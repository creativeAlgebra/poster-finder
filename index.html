<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Posters">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Poster Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0d0b0c; --velvet: #5c0f17; --velvet-deep: #2a0609; --gold: #e9c46a; --gold-dim: #8a7038;
    --bulb: #ffe7a3; --ink: #f3ece0; --muted: #b7ab98; --frame: #1a1416;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 15px/1.5 Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
    /* The theater (theater.jpg): curtains at the sides, the dark screen wall in the middle, seats at the foot.
       A shade at the foot keeps the search readable over the seats. */
    background:
      linear-gradient(180deg, rgba(13, 11, 12, .15) 0%, rgba(13, 11, 12, 0) 45%, rgba(13, 11, 12, .55) 80%, rgba(13, 11, 12, .9) 100%),
      url("theater.jpg") center 30% / cover no-repeat fixed,
      var(--night);
    /* One screen, no scrolling: the poster frame takes whatever height the marquee, strip and search leave. */
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-columns: minmax(0, 1fr);
    height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* The marquee */
  /* Clear of the notch or Dynamic Island when opened from the Home Screen (full screen). */
  header { text-align: center; padding: calc(22px + env(safe-area-inset-top)) 16px 4px; }
  @media (max-height: 640px) { header { padding-top: 14px; } .marquee h1 { font-size: 26px; } .booth { padding-bottom: 10px; } footer { display: none; } }
  .marquee {
    display: inline-block; padding: 14px 34px 12px; border-radius: 10px; background: #171213;
    border: 2px solid var(--gold-dim); position: relative;
    box-shadow: 0 0 0 6px #171213, 0 0 0 8px var(--gold-dim), 0 0 40px rgba(233, 196, 106, .15);
  }
  .marquee::before, .marquee::after { content: ""; position: absolute; left: 10px; right: 10px; height: 6px;
    background: radial-gradient(circle, var(--bulb) 0 2.2px, transparent 2.6px) 0 50% / 16px 6px repeat-x;
    filter: drop-shadow(0 0 3px rgba(255, 220, 140, .9)); animation: chase 1.6s steps(2) infinite; }
  .marquee::before { top: -14px; } .marquee::after { bottom: -14px; animation-delay: .8s; }
  @keyframes chase { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .marquee::before, .marquee::after { animation: none; } }
  .marquee small { display: block; font: 500 11px/1 Inter, sans-serif; letter-spacing: .3em; color: var(--gold); margin-bottom: 6px; }
  .marquee h1 { margin: 0; font: 400 34px/1.05 Limelight, Georgia, serif; color: var(--bulb); text-shadow: 0 0 12px rgba(255, 210, 120, .45); }

  /* The screen: one poster, framed */
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px 16px 6px; min-height: 0; }
  .frame {
    position: relative; flex: 0 0 auto; height: min(450px, calc(100% - 64px)); min-height: 120px; max-width: 64vw; aspect-ratio: 2 / 3;
    border-radius: 4px; background: var(--frame);
    padding: 14px; border: 1px solid #3a2c22;
    box-shadow: inset 0 0 0 2px var(--gold-dim), 0 0 0 10px #241a14, 0 0 0 12px var(--gold-dim),
      0 30px 60px rgba(0, 0, 0, .65), 0 0 80px rgba(255, 210, 130, .10);
  }
  .frame button { all: unset; display: block; width: 100%; height: 100%; cursor: pointer; border-radius: 2px; }
  .frame button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; }
  .frame .blank { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 18px;
    border: 1px dashed #4a3a2c; border-radius: 2px; color: var(--muted); font-size: 14px; }
  .frame .blank b { display: block; font: 400 22px/1.2 Limelight, Georgia, serif; color: var(--gold); margin-bottom: 8px; font-weight: 400; }
  .caption { flex: 0 0 auto; text-align: center; margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; min-height: 36px; }
  .caption .copy { margin-top: 0; }
  .caption .title { font: 400 22px/1.2 Limelight, Georgia, serif; color: var(--bulb); }
  .caption .year { color: var(--muted); font-size: 13px; }
  .copy { margin-top: 12px; font: 500 14px Inter, sans-serif; color: #1b1210; background: var(--gold); border: 0;
    border-radius: 999px; padding: 9px 20px; cursor: pointer; }
  .copy:hover { background: var(--bulb); }
  .copy[hidden] { display: none; }

  /* The film strip of results */
  .strip-wrap { padding: 0 16px; min-width: 0; overflow: hidden; }
  .strip { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; width: 100%; touch-action: pan-x; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; padding: 10px 6px 12px; scroll-snap-type: x proximity;
    max-width: 980px; margin: 0 auto; scrollbar-width: thin; }
  .strip:empty { display: none; }
  .strip .note { color: var(--muted); font-size: 13px; padding: 8px 4px; white-space: nowrap; }
  .thumb { all: unset; flex: 0 0 auto; width: 72px; scroll-snap-align: start; cursor: pointer; border-radius: 3px; }
  .thumb img { width: 72px; height: 108px; object-fit: cover; display: block; border-radius: 3px; opacity: .8; transition: opacity .15s, transform .15s; }
  .thumb:hover img, .thumb:focus-visible img { opacity: 1; transform: translateY(-2px); }
  .thumb[aria-current="true"] img { opacity: 1; box-shadow: 0 0 0 2px var(--gold); }
  .thumb:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* The box office: search at the bottom */
  .booth { padding: 10px 16px 18px; min-width: 0; }
  .booth-inner { max-width: 640px; margin: 0 auto; }
  form.search { display: flex; gap: 8px; background: #171213; border: 1px solid var(--gold-dim); border-radius: 999px; padding: 6px; }
  form.search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; padding: 8px 14px; outline: none; }
  form.search input::placeholder { color: #7f7363; }
  form.search button { font: 500 14px Inter, sans-serif; border: 0; border-radius: 999px; padding: 8px 18px; background: var(--gold); color: #1b1210; cursor: pointer; }
  .recent { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
  .recent button { font: 12px Inter, sans-serif; color: var(--muted); background: transparent; border: 1px solid #3a2f26; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .recent button:hover { color: var(--ink); border-color: var(--gold-dim); }

  footer { text-align: center; font-size: 11px; color: #7f7363; padding: 0 16px 16px; }
  footer a, .linkish { color: inherit; }
  .linkish { border: 0; background: none; padding: 0; text-decoration: underline; font: inherit; cursor: pointer; }

  .status { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--bulb); color: #1b1210;
    padding: 9px 16px; border-radius: 999px; font: 500 14px Inter, sans-serif; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .status.show { opacity: 1; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* The trailer plays on the stage, over the poster frame. */
  .stage { position: relative; }
  .trailer-btn { font: 500 14px Inter, sans-serif; color: var(--ink); background: transparent; border: 1px solid var(--gold-dim);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .trailer-btn:hover { border-color: var(--gold); color: var(--bulb); }
  .trailer-btn[hidden] { display: none; }
  .player { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.75), rgba(0,0,0,.92)); }
  .player[hidden] { display: none; }
  .player .screen16 { width: min(100%, calc((100% - 40px) * 16 / 9)); max-width: 1000px; aspect-ratio: 16 / 9; max-height: calc(100% - 48px);
    box-shadow: 0 0 0 2px var(--gold-dim), 0 30px 60px rgba(0,0,0,.7); background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .player .close { margin-top: 10px; font: 500 13px Inter, sans-serif; color: var(--ink); background: rgba(23,18,19,.9);
    border: 1px solid var(--gold-dim); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .player-inner { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; }
  .recent .clear { border: 0; text-decoration: underline; color: #7f7363; }
  .who { color: var(--muted); font-size: 12px; text-align: center; margin: 0 0 4px; min-height: 18px; }
  button { -webkit-tap-highlight-color: transparent; }

  /* Phones: a smaller marquee, the title on one line and the three actions in a row beneath it, a tighter film
     strip, past searches in one sideways row, the search bar clear of the home indicator, no fine print. */
  @media (max-width: 600px) {
    body { background-position: center 22%, center 22%; }
    header { padding: calc(14px + env(safe-area-inset-top)) 12px 0; }
    .marquee { padding: 8px 20px 7px; box-shadow: 0 0 0 4px #171213, 0 0 0 5px var(--gold-dim), 0 0 30px rgba(233,196,106,.15); }
    .marquee::before { top: -11px; } .marquee::after { bottom: -11px; }
    .marquee small { font-size: 9px; margin-bottom: 3px; }
    .marquee h1 { font-size: 24px; }
    .stage { padding: 16px 12px 4px; }
    .frame { height: min(450px, calc(100% - 112px)); max-width: 72vw; padding: 9px; box-shadow: inset 0 0 0 2px var(--gold-dim), 0 0 0 6px #241a14, 0 0 0 7px var(--gold-dim), 0 20px 40px rgba(0,0,0,.6); }
    .frame .blank b { font-size: 18px; }
    .caption { margin-top: 12px; gap: 6px; flex-direction: column; min-height: 0; }
    .caption .title { font-size: 18px; text-align: center; }
    .caption .year { font-size: 12px; }
    .caption .actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .copy, .trailer-btn { padding: 7px 10px; font-size: 13px; white-space: nowrap; }
    .wide { display: none; }
    .strip-wrap { padding: 0 8px; }
    .who { font-size: 11px; margin: 0; min-height: 0; }
    .strip { gap: 8px; padding: 6px 4px 8px; }
    .thumb, .thumb img { width: 56px; } .thumb img { height: 84px; }
    .booth { padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); }
    .recent { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
    .recent::-webkit-scrollbar { display: none; }
    .recent button { flex: 0 0 auto; }
    footer { display: none; }
    .player { padding: 8px; }
    .player .screen16 { width: 100%; }
  }
  @media (min-width: 601px) { .caption .actions { display: contents; } .narrow { display: none; } }
  /* Browse mode (phones): swipe up on the film strip, or tap its handle, and the poster shrinks while the strip's
     posters grow; swipe down (or tap again) to go back. */
  .handle { display: none; }
  @media (max-width: 600px) {
    .frame { transition: height .28s ease; }
    .thumb img, .thumb { transition: width .28s ease, height .28s ease; }
    .handle { display: block; margin: 0 auto 2px; width: 44px; height: 18px; border: 0; background: none; padding: 7px 0; cursor: pointer; }
    .handle::before { content: ""; display: block; height: 4px; border-radius: 4px; background: var(--gold-dim); }
    body.browse .frame { height: min(210px, calc(100% - 112px)); }
    body.browse .stage { justify-content: flex-end; }
    body.browse .thumb, body.browse .thumb img { width: 136px; }
    body.browse .thumb img { height: 204px; }
    body.browse .strip { gap: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="marquee"><small>NOW SHOWING</small><h1>Poster Finder</h1></div>
</header>

<main class="stage">
  <div class="frame">
    <button id="screen" type="button" aria-label="Copy this poster" disabled>
      <div class="blank" id="blank"><div><b>Tonight's feature</b>Search a movie below, pick a poster, then click it to copy.</div></div>
    </button>
  </div>
  <div class="caption" aria-live="polite">
    <div class="title" id="title"></div>
    <div class="year" id="year"></div>
    <div class="actions">
      <button class="copy" id="copy" type="button" hidden>Copy<span class="wide"> poster</span></button>
      <button class="trailer-btn" id="trailer" type="button" hidden>▶ Trailer</button>
      <button class="trailer-btn" id="related" type="button" hidden>More like this</button>
      <button class="trailer-btn" id="posters" type="button" hidden><span class="wide">Other posters</span><span class="narrow">Posters</span></button>
    </div>
  </div>
  <div class="player" id="player" hidden role="dialog" aria-label="Trailer">
    <div class="player-inner">
      <div class="screen16" id="screen16"></div>
      <button class="close" id="closePlayer" type="button">Close trailer</button>
    </div>
  </div>
</main>

<div class="strip-wrap"><button class="handle" id="handle" type="button" aria-label="Bigger posters in the strip" aria-pressed="false"></button><p class="who"><span id="who"></span> <button class="linkish" id="back" type="button" hidden>Back to results</button></p><div class="strip" id="strip" role="listbox" aria-label="Posters found"></div></div>

<section class="booth">
  <div class="booth-inner">
    <form class="search" id="searchForm" role="search">
      <label for="q" class="visually-hidden">Search movies</label>
      <input type="search" id="q" placeholder="A movie, a show, an actor, a year…" autocomplete="off" autofocus>
      <button>Search</button>
    </form>
    <div class="recent" id="recent"></div>
  </div>
</section>

<footer>
  Copy a poster, then in Subtextual's Library click your document's card and paste (⌘V), or use the card's picture button → Paste image.<br>
  <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a> · This product uses the TMDB API but is not endorsed or certified by TMDB.
</footer>

<div class="status" id="status" role="status" aria-live="polite"></div>

<script>
(() => {
  const KEY = "poster-finder:key", RECENT = "poster-finder:recent";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  // A setup link (…/#key=…) saves the key in this browser, then takes it out of the address bar. The part after
  // # never reaches the web server. Also when the page is already open and only the #key part changes.
  const takeLinkKey = () => {
    const fromLink = new URLSearchParams(location.hash.slice(1)).get("key");
    if (!fromLink) return false;
    store.set(KEY, decodeURIComponent(fromLink).trim());
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  };
  takeLinkKey();
  let key = store.get(KEY, "");
  let current = null, timer;
  // Only the newest request may change the film strip: each search, related list, poster list or Back takes a new
  // turn, and a slower, older answer sees that its turn has passed and is dropped. Answers about the poster in the
  // frame (its trailer, how many posters it has) are dropped the same way once another poster is in the frame.
  let stripTurn = 0;

  const say = (text) => {
    const s = $("status"); s.textContent = text; s.classList.add("show");
    clearTimeout(timer); timer = setTimeout(() => s.classList.remove("show"), 2800);
  };
  window.addEventListener("hashchange", () => { if (takeLinkKey()) { key = store.get(KEY, ""); say("Key saved in this browser."); } });

  // Lookups go through Poster Finder's private relay (poster-finder-relay on Vercel), which holds the TMDB key, so
  // this page needs no key and clearing the browser changes nothing. A key saved in this browser is only a fallback.
  const RELAY = "https://poster-finder-relay.vercel.app/api/tmdb";
  async function direct(path, params) {
    const url = new URL("https://api.themoviedb.org/3" + path);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const headers = { accept: "application/json" };
    // A long token (v4 "read access token") goes in the Authorization header; a short v3 key goes in the URL.
    if (key.length > 40) headers.Authorization = "Bearer " + key; else url.searchParams.set("api_key", key);
    const res = await fetch(url, { headers });
    if (res.status === 401) throw new Error("TMDB didn't accept the saved key.");
    if (!res.ok) throw new Error("TMDB didn't answer (" + res.status + "). Try again in a moment.");
    return res.json();
  }
  // Answers are kept for the visit, so going back to a title or a search doesn't ask again.
  const cache = new Map();
  function tmdb(path, params) {
    const id = path + "?" + new URLSearchParams(params);
    if (!cache.has(id)) {
      const p = lookup(path, params);
      cache.set(id, p);
      p.catch(() => cache.delete(id));
      if (cache.size > 200) cache.delete(cache.keys().next().value);
    }
    return cache.get(id);
  }
  async function lookup(path, params) {
    const url = new URL(RELAY);
    url.searchParams.set("path", path.replace(/^\//, ""));
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    try {
      const res = await fetch(url, { headers: { accept: "application/json" } });
      if (res.ok) return res.json();
      if (!key) throw new Error("The movie lookup didn't answer (" + res.status + "). Try again in a moment.");
    } catch (e) {
      if (!key) throw new Error("The movie lookup couldn't be reached. Check the connection and try again.");
    }
    return direct(path, params);
  }
  // Every result is one shape: a movie or a show, with a poster.
  const item = (m, type) => ({
    id: m.id, type: type || m.media_type || "movie", title: m.title || m.name || "",
    date: m.release_date || m.first_air_date || "", poster_path: m.poster_path, popularity: m.popularity || 0,
  });
  const titles = (list) => list.filter((m) => m.poster_path && (m.media_type === "movie" || m.media_type === "tv" || !m.media_type)).map((m) => item(m));
  // Movies and shows whose titles match (the fuzzy fallback below uses this too).
  const find = async (q) => titles((await tmdb("/search/multi", { query: q, include_adult: "false" })).results || []);
  // An actor's (or director's) films and shows, best known first.
  async function filmsOf(person) {
    const c = await tmdb("/person/" + person.id + "/combined_credits", {});
    // Their real roles, not talk-show and award-show appearances as themselves; the best-known (most voted) first.
    const self = /^(self|himself|herself|themselves|narrator)\b/i;
    const all = [...(c.cast || []).filter((x) => !self.test(x.character || "") && !(x.genre_ids || []).some((g) => g === 10767 || g === 10763)),
      ...(c.crew || []).filter((x) => x.job === "Director")];
    const seen = new Map();
    for (const m of all) if (m.poster_path && !seen.has(m.media_type + m.id)) seen.set(m.media_type + m.id, { ...item(m), votes: m.vote_count || 0 });
    return [...seen.values()].sort((a, b) => b.votes - a.votes).slice(0, 40);
  }

  // How many letters differ between two titles (edit distance), for ranking near-misses.
  function distance(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let prev = row[0]; row[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const t = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = t;
      }
    }
    return row[b.length];
  }

  function renderRecent() {
    const box = $("recent"); box.innerHTML = "";
    const list = store.get(RECENT, []);
    for (const q of list) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = q;
      b.onclick = () => { $("q").value = q; search(q); };
      box.append(b);
    }
    if (list.length) {
      const c = document.createElement("button"); c.type = "button"; c.className = "clear"; c.textContent = "Clear";
      c.onclick = () => { store.del(RECENT); renderRecent(); say("Past searches cleared."); };
      box.append(c);
    }
  }

  function feature(m) {
    const sameTitle = current && current.type === m.type && current.id === m.id;
    current = m;
    closeTrailer();
    const screen = $("screen");
    screen.disabled = false;
    screen.innerHTML = "";
    const img = document.createElement("img");
    img.src = "https://image.tmdb.org/t/p/w500" + m.poster_path; img.alt = m.title + " poster";
    screen.append(img);
    $("title").textContent = m.title;
    $("year").textContent = (m.date || "").slice(0, 4) + (m.type === "tv" ? " · series" : "");
    $("copy").hidden = false;
    $("trailer").hidden = false;
    $("related").hidden = false;
    // Other posters: shown once TMDB says this title has more than one.
    if (!sameTitle) {
      $("posters").hidden = true;
      postersOf(m).then((list) => { if (current && current.type === m.type && current.id === m.id) $("posters").hidden = list.length < 2; }, () => {});
    }
    mark();
  }
  // The thumbnail of the poster in the frame is lit: by title in a list of titles, by picture in a list of posters.
  function mark() {
    for (const t of $("strip").querySelectorAll(".thumb")) {
      const on = !!current && t.dataset.id === current.type + current.id && (stripMode !== "posters" || t.dataset.poster === current.poster_path);
      t.setAttribute("aria-current", String(on));
    }
  }

  // Search anything: a title, an actor or director, a year ("1994"), or both ("comedy 1994" keeps titles from that year).
  // A number that looks like a year may also be part of a title ("1917", "Blade Runner 2049", "2001: A Space
  // Odyssey"), so the whole text is always searched as a title too, and titles that contain the number come first.
  const yearRe = /\b(18|19|20)\d{2}\b/;
  const key2 = (m) => m.type + m.id;
  const merge = (...lists) => { const seen = new Map(); for (const m of [].concat(...lists)) if (!seen.has(key2(m))) seen.set(key2(m), m); return [...seen.values()]; };
  async function search(q) {
    q = q.trim(); if (!q) return;
    const turn = ++stripTurn;
    const strip = $("strip"); strip.innerHTML = '<span class="note">Searching…</span>'; $("who").textContent = ""; $("back").hidden = true;
    try {
      const year = (q.match(yearRe) || [])[0];
      const words = q.replace(yearRe, "").replace(/^[\s:,.\-–]+|[\s:,.\-–]+$/g, "").trim();
      let found = [], label = "", close = false;
      // Titles with the number in their name ("Blade Runner 2049"), searched with the whole text.
      const named = year ? (await find(q)).filter((m) => m.title.includes(year)) : [];
      if (year && !words) {
        // A year alone: a film named that ("1917") first, then that year's best-known films.
        const popular = ((await tmdb("/discover/movie", { primary_release_year: year, sort_by: "popularity.desc", include_adult: "false" })).results || []).filter((m) => m.poster_path).map((m) => item(m, "movie"));
        found = merge(named, popular);
        label = (named.length ? "“" + year + "” and popular" : "Popular") + " films from " + year;
      } else {
        const res = (await tmdb("/search/multi", { query: words, include_adult: "false" })).results || [];
        const person = res.find((r) => r.media_type === "person");
        const top = res[0];
        found = titles(res);
        // When the best match is a person (an actor or director), show their films first.
        if (person && top && top.media_type === "person") {
          const theirs = await filmsOf(person);
          found = merge(theirs, found);
          label = "Films and shows with " + person.name;
        }
        if (year) {
          const fromYear = found.filter((m) => (m.date || "").startsWith(year));
          found = merge(named, fromYear);
          if (fromYear.length) label = (label || "Matches") + " from " + year;
          else label = "";
        }
        // A misspelling: TMDB matches the starts of words, so a typo near the end is caught by trimming letters off;
        // one near the start, by dropping the first letter or two. The closest titles come first. A few lookups
        // at a time, at most eight, so a long typo doesn't flood the movie lookup.
        if (!found.length) {
          const pieces = new Set();
          for (const w of q.toLowerCase().split(/\s+/).filter((w) => w.length >= 3)) {
            pieces.add(w);
            for (let k = w.length - 1; k >= 4; k -= 1) pieces.add(w.slice(0, k));
            for (let i = 1; i <= 2 && w.length - i >= 4; i++) pieces.add(w.slice(i, i + 5));
          }
          const todo = [...pieces].slice(0, 8), pools = [];
          for (let i = 0; i < todo.length; i += 4) {
            pools.push(...await Promise.all(todo.slice(i, i + 4).map((w) => find(w).catch(() => []))));
            if (turn !== stripTurn) return;
          }
          const s = q.toLowerCase();
          found = merge(...pools)
            .map((m) => { const t = m.title.toLowerCase(); return { m, d: Math.min(distance(s, t), distance(s, t.replace(/^(the|a|an) /, ""))) }; })
            .filter((x) => x.d <= Math.max(3, Math.round(s.length * 0.4)))
            .sort((a, b) => a.d - b.d || b.m.popularity - a.m.popularity)
            .slice(0, 20).map((x) => x.m);
          close = found.length > 0;
          if (close) label = "No exact match. Closest titles:";
        }
      }
      if (turn !== stripTurn) return;
      store.set(RECENT, [q, ...store.get(RECENT, []).filter((x) => x.toLowerCase() !== q.toLowerCase())].slice(0, 8));
      renderRecent();
      strip.innerHTML = "";
      $("who").textContent = label;
      if (!found.length) { results = null; strip.innerHTML = '<span class="note">Nothing found. Check the spelling, or try one word, a name or a year.</span>'; return; }
      results = { found, label };
      fill(found);
      feature(found[0]);
    } catch (e) { if (turn === stripTurn) { strip.innerHTML = ""; say(e.message); } }
  }

  // The film strip: one thumbnail per title (or per poster); a click puts it in the frame, a double-click also copies it.
  let results = null, stripMode = "titles";
  const langName = (code) => { try { return new Intl.DisplayNames([navigator.language || "en"], { type: "language" }).of(code); } catch { return code; } };
  function fill(list, mode = "titles") {
    stripMode = mode;
    const strip = $("strip"); strip.innerHTML = "";
    for (const m of list) {
      const b = document.createElement("button"); b.className = "thumb"; b.type = "button"; b.role = "option";
      b.dataset.id = m.type + m.id; b.dataset.poster = m.poster_path;
      const yr = (m.date || "").slice(0, 4);
      const lang = m.lang === undefined ? "" : " · " + (m.lang ? langName(m.lang) : "no text");
      b.title = mode === "posters" ? m.title + lang : m.title + (yr ? " (" + yr + ")" : "");
      const img = document.createElement("img"); img.src = "https://image.tmdb.org/t/p/w154" + m.poster_path; img.alt = b.title; img.loading = "lazy";
      b.append(img);
      b.onclick = () => feature(m);
      b.ondblclick = () => (feature(m), copy(m));
      strip.append(b);
    }
    mark();
    strip.scrollLeft = 0;
  }
  // More like this: TMDB's recommendations for the title in the frame (its "similar" list when there are none).
  async function related(m) {
    if (!m) return;
    const turn = ++stripTurn;
    const kind = m.type === "tv" ? "tv" : "movie";
    try {
      let list = ((await tmdb("/" + kind + "/" + m.id + "/recommendations", {})).results || []).filter((x) => x.poster_path).map((x) => item(x, kind));
      if (!list.length) list = ((await tmdb("/" + kind + "/" + m.id + "/similar", {})).results || []).filter((x) => x.poster_path).map((x) => item(x, kind));
      if (turn !== stripTurn) return;
      if (!list.length) return say("No related titles found for “" + m.title + "”.");
      $("who").textContent = "More like " + m.title;
      $("back").hidden = !results;
      fill(list);
    } catch (e) { if (turn === stripTurn) say(e.message); }
  }
  // Other posters: every poster TMDB has for the title, in the visitor's language, in English, and with no text,
  // the best-voted first. The poster the search found comes first.
  async function postersOf(m) {
    const kind = m.type === "tv" ? "tv" : "movie";
    const langs = [...new Set([(navigator.language || "en").slice(0, 2).toLowerCase(), "en", "null"])].join(",");
    const r = await tmdb("/" + kind + "/" + m.id + "/images", { include_image_language: langs });
    const list = (r.posters || []).slice().sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0) || (b.vote_average || 0) - (a.vote_average || 0))
      .map((p) => ({ ...m, poster_path: p.file_path, lang: p.iso_639_1 }));
    const found = list.find((p) => p.poster_path === m.poster_path) || { ...m, lang: undefined };
    return [found, ...list.filter((p) => p !== found)].slice(0, 40);
  }
  async function showPosters(m) {
    if (!m) return;
    const turn = ++stripTurn;
    try {
      const list = await postersOf(m);
      if (turn !== stripTurn) return;
      if (list.length < 2) return say("TMDB has just the one poster for “" + m.title + "”.");
      $("who").textContent = list.length + " posters for " + m.title;
      $("back").hidden = !results;
      fill(list, "posters");
    } catch (e) { if (turn === stripTurn) say(e.message); }
  }

  // The trailer: TMDB lists each title's videos; the official YouTube trailer plays on the stage, over the frame.
  async function playTrailer(m) {
    if (!m) return;
    try {
      const v = ((await tmdb("/" + (m.type === "tv" ? "tv" : "movie") + "/" + m.id + "/videos", {})).results || []).filter((x) => x.site === "YouTube");
      // Another poster was put in the frame while this one's trailer was being looked up.
      if (current !== m) return;
      const pick = v.find((x) => x.type === "Trailer" && x.official) || v.find((x) => x.type === "Trailer") || v.find((x) => x.type === "Teaser") || v[0];
      if (!pick) return say("No trailer found for “" + m.title + "”.");
      const f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(pick.key) + "?autoplay=1&rel=0&modestbranding=1";
      f.title = m.title + " trailer";
      f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      $("screen16").innerHTML = ""; $("screen16").append(f);
      $("player").hidden = false; $("closePlayer").focus();
    } catch (e) { if (current === m) say(e.message); }
  }
  function closeTrailer() { if ($("player").hidden) return; $("player").hidden = true; $("screen16").innerHTML = ""; }

  // The clipboard takes PNG everywhere, so the poster is redrawn as a PNG (TMDB's images allow this). It starts
  // from TMDB's original file, scaled so the long side is at most 2000 pixels (sharp, but not a huge paste).
  const SHARP = 2000;
  async function copy(m) {
    if (!m) return;
    if (!navigator.clipboard || !window.ClipboardItem) return say("This browser can't copy images. Try Chrome or Safari.");
    const png = (async () => {
      const res = await fetch("https://image.tmdb.org/t/p/original" + m.poster_path, { mode: "cors" });
      if (!res.ok) throw new Error("poster " + res.status);
      const bmp = await createImageBitmap(await res.blob());
      const scale = Math.min(1, SHARP / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise((ok, no) => c.toBlob((b) => (b ? ok(b) : no(new Error("no image"))), "image/png"));
    })();
    say("Copying “" + m.title + "”…");
    try {
      // Passing the promise keeps Safari's "user gesture" rule happy while the poster downloads.
      await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
      say("Copied “" + m.title + "”. Now paste it on your card in Subtextual.");
    } catch (e) { say("Couldn't copy that poster. Try again, or right-click it and choose Copy Image."); }
  }

  $("screen").onclick = () => copy(current);
  $("copy").onclick = () => copy(current);
  $("trailer").onclick = () => playTrailer(current);
  const phone = () => matchMedia("(max-width: 600px)").matches;
  $("related").onclick = () => { related(current); if (phone()) browse(true); };
  $("posters").onclick = () => { showPosters(current); if (phone()) browse(true); };
  // Browse mode on phones: a vertical swipe anywhere (up: bigger posters in the strip, down: back), or a tap on the handle.
  const browse = (on) => {
    document.body.classList.toggle("browse", on);
    $("handle").setAttribute("aria-pressed", String(on));
    $("handle").setAttribute("aria-label", on ? "Smaller posters in the strip" : "Bigger posters in the strip");
  };
  $("handle").onclick = () => browse(!document.body.classList.contains("browse"));
  let touch = null;
  // Anywhere on the page, except while a trailer plays.
  document.addEventListener("touchstart", (e) => {
    if (!$("player").hidden || e.touches.length > 1) return (touch = null);
    const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) * 1.5) browse(dy < 0);
  }, { passive: true });
  $("back").onclick = () => { if (!results) return; ++stripTurn; $("who").textContent = results.label; $("back").hidden = true; fill(results.found); };
  $("closePlayer").onclick = () => { closeTrailer(); $("trailer").focus(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTrailer(); });
  $("searchForm").onsubmit = (e) => { e.preventDefault(); search($("q").value); };
  renderRecent();
})();
</script>
</body>
</html>
