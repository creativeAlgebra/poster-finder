<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#0d0b0c"/>
    </radialGradient>
    <linearGradient id="velvet" x1="0" x2="1">
      <stop offset="0" stop-color="#3d070c"/>
      <stop offset=".18" stop-color="#8e1622"/>
      <stop offset=".34" stop-color="#4a0a10"/>
      <stop offset=".5" stop-color="#9a1a27"/>
      <stop offset=".66" stop-color="#4a0a10"/>
      <stop offset=".82" stop-color="#8e1622"/>
      <stop offset="1" stop-color="#3d070c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <filter id="bulb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- the poster case -->
  <rect x="136" y="70" width="240" height="372" rx="10" fill="#241a14" stroke="url(#gold)" stroke-width="10"/>
  <rect x="160" y="94" width="192" height="324" rx="4" fill="url(#velvet)"/>
  <!-- a spotlight on the curtain -->
  <ellipse cx="256" cy="230" rx="78" ry="110" fill="#ffd98a" opacity=".16"/>
  <!-- the star -->
  <path d="M256 168 l20 44 48 5 -36 32 10 47 -42 -24 -42 24 10 -47 -36 -32 48 -5 z" fill="url(#gold)"/>
  <!-- the stage edge -->
  <rect x="160" y="366" width="192" height="52" fill="#1a1012"/>
  <rect x="160" y="362" width="192" height="6" fill="url(#gold)" opacity=".8"/>
  <!-- marquee bulbs around the case -->
  <g fill="#ffe7a3" filter="url(#bulb)">
    <circle cx="156" cy="52" r="7"/><circle cx="196" cy="52" r="7"/><circle cx="236" cy="52" r="7"/><circle cx="276" cy="52" r="7"/><circle cx="316" cy="52" r="7"/><circle cx="356" cy="52" r="7"/>
    <circle cx="156" cy="460" r="7"/><circle cx="196" cy="460" r="7"/><circle cx="236" cy="460" r="7"/><circle cx="276" cy="460" r="7"/><circle cx="316" cy="460" r="7"/><circle cx="356" cy="460" r="7"/>
    <circle cx="112" cy="96" r="7"/><circle cx="112" cy="146" r="7"/><circle cx="112" cy="196" r="7"/><circle cx="112" cy="246" r="7"/><circle cx="112" cy="296" r="7"/><circle cx="112" cy="346" r="7"/><circle cx="112" cy="396" r="7"/>
    <circle cx="400" cy="96" r="7"/><circle cx="400" cy="146" r="7"/><circle cx="400" cy="196" r="7"/><circle cx="400" cy="246" r="7"/><circle cx="400" cy="296" r="7"/><circle cx="400" cy="346" r="7"/><circle cx="400" cy="396" r="7"/>
  </g>
</svg>
